name: library-management-system

x-default-logging: &default-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-CU22-GDR1-ubuntu-22.04
    container_name: lms-db
    logging: *default-logging
    networks:
      - lms-network
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD must be set}
    ports:
      - "127.0.0.1:${DB_PORT:-1433}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /opt/mssql-tools18/bin/sqlcmd
          -S localhost
          -U sa
          -P "$${MSSQL_SA_PASSWORD}"
          -Q "SELECT 1"
          -C
          -b
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lms-api
    logging: *default-logging
    networks:
      - lms-network
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:?ASPNETCORE_ENVIRONMENT must be set}
      ASPNETCORE_URLS: http://+:8080
      Cors__AllowedOrigins: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS must be set}
      Database__Server: db,1433
      Database__Name: ${MSSQL_DATABASE:-LibraryManagementDb}
      Database__User: sa
      Database__Password: ${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD must be set}
      Jwt__Issuer: ${JWT_ISSUER:?JWT_ISSUER must be set}
      Jwt__Audience: ${JWT_AUDIENCE:?JWT_AUDIENCE must be set}
      Jwt__Key: ${JWT_KEY:?JWT_KEY must be set}
      Jwt__ExpiryMinutes: ${JWT_EXPIRY_MINUTES:?JWT_EXPIRY_MINUTES must be set}
      Seed__AdminEmail: ${SEED_ADMIN_EMAIL:?SEED_ADMIN_EMAIL must be set}
      Seed__AdminPassword: ${SEED_ADMIN_PASSWORD:?SEED_ADMIN_PASSWORD must be set}
      Seed__UserEmail: ${SEED_USER_EMAIL:?SEED_USER_EMAIL must be set}
      Seed__UserPassword: ${SEED_USER_PASSWORD:?SEED_USER_PASSWORD must be set}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "dotnet", "LibraryManagement.Api.dll", "--healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lms-web
    logging: *default-logging
    networks:
      - lms-network
    ports:
      - "127.0.0.1:${WEB_PORT:-4200}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  sqlserver-data:

networks:
  lms-network:
    name: lms-network
    driver: bridge
